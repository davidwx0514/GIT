<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#54775c"><title>小步 · 数学错题本</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#">✳ <span>小步<span class="brand-sub">每一次订正，都是向前一小步</span></span></a><span class="grade">初一 · 数学</span></header>
<main><section class="hero"><div><p class="eyebrow">MY LEARNING NOTEBOOK</p><h1>把不会的，<br>慢慢变成会的<span>。</span></h1><p class="muted">收集小小的失误，发现大大的进步。</p><button class="primary" id="add">＋ 记录一道错题</button></div><div class="illustration" aria-hidden="true"><div class="paper"><span>MATH NOTES</span><b>x + 3 = 7</b><i>x = 4 ✓</i><div class="paper-line"></div><div class="paper-line short"></div><em>今天又进步了一点点 ✨</em></div><span class="floating">✦</span><span class="pencil">✎</span></div></section>
<section class="stats" aria-label="学习概况"><div><span>收集的错题</span><strong id="total">0</strong></div><div><span>还在练习</span><strong id="learning">0</strong></div><div><span>已经掌握</span><strong id="mastered">0</strong></div><div class="encouragement">🌱<p>不用一次全会，<br>每天进步一点就很好。</p></div></section>
<section class="notebook"><div class="section-title"><h2>我的错题本 <small id="count"></small></h2><div class="tools"><button id="export">导出备份</button><button id="import">导入备份</button><input id="import-file" type="file" accept="application/json" hidden></div></div><div class="filters"><div class="tabs" role="group" aria-label="掌握程度"><button class="active" data-filter="all">全部错题</button><button data-filter="practice">待复习</button><button data-filter="mastered">已掌握</button></div><label class="search">⌕ <input id="search" placeholder="搜索题目、知识点…" aria-label="搜索错题"></label></div><div class="topics"><button class="selected" data-topic="全部">全部知识点</button><button data-topic="有理数">有理数</button><button data-topic="整式">整式</button><button data-topic="一元一次方程">一元一次方程</button><button data-topic="几何初步">几何初步</button><button data-topic="其他">其他</button></div><div id="cards" class="cards"></div></section>
<footer>小步 · 认真对待每一个“还不会” <span>数据仅保存在当前浏览器，请定期导出备份。</span></footer></main>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="form-title">记录一道错题</h2><button type="button" class="close" id="close" aria-label="关闭">×</button></div><p class="muted">记下题目，也记下自己的思考。</p><label>题目内容 <textarea id="question" required rows="3" placeholder="输入题目，或描述照片中的题目…"></textarea></label><div class="form-row"><label>知识点<select id="topic"><option>有理数</option><option>整式</option><option>一元一次方程</option><option>几何初步</option><option>其他</option></select></label><label>错因<select id="reason"><option>概念没理解</option><option>计算出错</option><option>审题不仔细</option><option>方法没想到</option><option>其他</option></select></label></div><label>题目照片 <input id="photo" type="file" accept="image/*"></label><img id="photo-preview" alt="题目照片预览" hidden><button type="button" id="remove-photo" hidden>移除照片</button><label>正确答案与解题思路<textarea id="answer" rows="3" placeholder="写下答案和关键步骤，复习时可以展开查看。"></textarea></label><label>给自己的提醒<input id="note" placeholder="例如：负数乘负数得正数！"></label><button class="primary submit" type="submit">保存到错题本</button></form></dialog>
<dialog id="detail"><div class="dialog-head"><h2>复习一下</h2><button class="close" id="detail-close" aria-label="关闭">×</button></div><div id="detail-content"></div></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
